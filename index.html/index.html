<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ticket Demo</title>

  <link rel="stylesheet" href="style.css">

  <!-- QR library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="top">
  <div class="back">←</div>

  <div class="small-title">My Tickets</div>

  <div class="event-title">
    Last Night in Luff
  </div>
</div>

<div class="container">

  <div class="card">

    <div class="name-row">
      <span class="name">Zack Henrick</span>

      <span class="student">
        Student
      </span>
    </div>

    <div class="ticket-id">
      F511345
    </div>

  </div>

  <div class="qr-wrapper">

    <!-- QR gets generated here -->
    <div id="qrcode"></div>

    <div class="clock-area">
      <span id="clock">00:00:00</span>
      <div class="spinner"></div>
    </div>

  </div>

  <div class="dates">

    <div class="label">Start Date/Time</div>
    <div class="value">10/06/2026, 22:30</div>

    <div class="label">End Date/Time</div>
    <div class="value">11/06/2026, 04:00</div>

  </div>

</div>

<div class="nav">
  <div>🏠</div>
  <div>🧺</div>
  <div>👤</div>
</div>

<script src="script.js"></script>

</body>
</html>
